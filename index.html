<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glycan Drawing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Glycan Drawing Tool</h1>
        
        <!-- Top Panel: Actions and Functions -->
        <div class="top-panel">
            <div class="action-buttons">
                <button id="undoBtn" class="action-btn undo">撤回</button>
                <button id="redoBtn" class="action-btn redo">恢复</button>
                
                <!-- Export dropdown -->
                <div class="export-dropdown">
                    <button id="exportBtn" class="action-btn export">导出 ▾</button>
                    <div class="export-options">
                        <div class="export-option" data-format="svg">SVG（可编辑矢量）</div>
                        <div class="export-option" data-format="png">PNG（透明背景）</div>
                        <div class="export-option" data-format="jpg">JPG（白色背景）</div>
                    </div>
                </div>
                
                <button id="clearBtn" class="action-btn clear">清空画布</button>
                
                <!-- Canvas Size Controls -->
                <div class="canvas-size-controls">
                    <label>导出区域:</label>
                    <button id="canvasSmall" class="size-btn" data-size="small">小</button>
                    <button id="canvasMedium" class="size-btn active" data-size="medium">中</button>
                    <button id="canvasLarge" class="size-btn" data-size="large">大</button>
                </div>
                
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <label>缩放:</label>
                    <input type="range" id="zoomSlider" min="50" max="300" value="100" step="10">
                    <span id="zoomValue">100%</span>
                    <button id="zoomReset" class="action-btn">重置</button>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Left Panel: Tools -->
            <div class="left-panel">
                <div class="panel-section">
                    <h3>工具</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="select" title="选择">
                            <span>↖️</span>
                            选择
                        </button>
                        <button class="tool-btn" data-tool="add" title="添加糖">
                            <span>🍬</span>
                            添加糖
                        </button>
                        <button class="tool-btn" data-tool="text" title="添加文字">
                            <span>📝</span>
                            添加文字
                        </button>
                        <button class="tool-btn" data-tool="delete" title="橡皮擦">
                            <span>🧽</span>
                            橡皮擦
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Center: Workspace -->
            <div class="center-panel">
                <div id="workspace" class="workspace">
                    <!-- Export area visual background (not a container) -->
                    <div id="exportArea" class="export-area"></div>
                    <!-- SVG canvas spans entire workspace -->
                    <svg id="canvas" class="workspace-canvas" viewBox="0 0 4000 2800">
                        <!-- SVG content will be added here -->
                    </svg>
                </div>
            </div>
            
            <!-- Right Panel: Sugar Presets and Customization -->
            <!-- Right Panel - Adjustments -->
            <div class="right-panel">
                <!-- Sugar Controls (visible when add tool or sugars selected) -->
                <div class="panel-section" id="sugarControlsSection" style="display: block;">
                    <!-- SFNG Presets -->
                    <div class="control-subsection">
                        <h4>SNFG 糖预设</h4>
                        <div class="preset-grid" id="presetGrid">
                            <div class="preset-item" data-preset="glc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
                                </svg>
                                <span>Glc</span>
                            </div>
                            <div class="preset-item" data-preset="gal">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                                </svg>
                                <span>Gal</span>
                            </div>
                            <div class="preset-item" data-preset="man">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
                                </svg>
                                <span>Man</span>
                            </div>
                            <div class="preset-item" data-preset="fuc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,4 28,16 16,28 4,16" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
                                </svg>
                                <span>Fuc</span>
                            </div>
                            <div class="preset-item" data-preset="xyl">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,6 26,24 6,24" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
                                </svg>
                                <span>Xyl</span>
                            </div>
                            <div class="preset-item" data-preset="glcnac">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
                                </svg>
                                <span>GlcNAc</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Sugar Type -->
                    <div class="control-subsection">
                        <h4>自定义糖型</h4>
                        
                        <!-- Shape Selection -->
                        <div class="control-group">
                            <label>形状:</label>
                            <div class="shape-grid" id="shapeGrid">
                                <button class="shape-btn active" data-shape="circle" title="圆形">●</button>
                                <button class="shape-btn" data-shape="square" title="方形">■</button>
                                <button class="shape-btn" data-shape="triangle" title="三角形">▲</button>
                                <button class="shape-btn" data-shape="diamond" title="菱形">♦</button>
                                <button class="shape-btn" data-shape="star" title="星形">★</button>
                            </div>
                        </div>
                        
                        <!-- Color Selection -->
                        <div class="control-group">
                            <div class="color-grid" id="colorGrid">
                                <button class="color-btn active" data-color="#3498db" style="background-color: #3498db;" title="蓝色"></button>
                                <button class="color-btn" data-color="#e74c3c" style="background-color: #e74c3c;" title="红色"></button>
                                <button class="color-btn" data-color="#2ecc71" style="background-color: #2ecc71;" title="绿色"></button>
                                <button class="color-btn" data-color="#f39c12" style="background-color: #f39c12;" title="橙色"></button>
                                <button class="color-btn" data-color="#9b59b6" style="background-color: #9b59b6;" title="紫色"></button>
                                <button class="color-btn" data-color="#34495e" style="background-color: #34495e;" title="灰色"></button>
                                <button class="color-btn" data-color="#1abc9c" style="background-color: #1abc9c;" title="青色"></button>
                                <button class="color-btn" data-color="#f1c40f" style="background-color: #f1c40f;" title="黄色"></button>
                            </div>
                            <div class="control-group">
                                <input type="color" id="customSugarColor" value="#3498db">
                                <input type="text" id="customSugarColorHex" value="#3498db" maxlength="7" placeholder="#3498db">
                            </div>
                            <div class="control-group">
                                <label for="customSugarOpacity">糖填充透明度:</label>
                                <input type="range" id="customSugarOpacity" min="0" max="1" value="1" step="0.1">
                                <span id="customSugarOpacityValue">100%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Sugar Style -->
                    <div class="control-subsection">
                        <h4>糖样式</h4>
                        <div class="control-group">
                            <label for="sugarSize">大小:</label>
                            <input type="range" id="sugarSize" min="10" max="40" value="20" step="2">
                            <span id="sugarSizeValue">20</span>
                        </div>
                        <div class="control-group">
                            <label for="sugarBorderWidth">边缘粗细:</label>
                            <input type="range" id="sugarBorderWidth" min="1" max="5" value="2" step="0.5">
                            <span id="sugarBorderWidthValue">2</span>
                        </div>
                        <div class="control-group">
                            <label>边缘样式:</label>
                            <div class="border-style-buttons">
                                <button class="border-style-btn active" data-style="solid">实线</button>
                                <button class="border-style-btn" data-style="dashed">虚线</button>
                                <button class="border-style-btn" data-style="dotted">点线</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="sugarBorderColor">边缘颜色:</label>
                            <input type="color" id="sugarBorderColor" value="#333333">
                            <input type="text" id="sugarBorderColorHex" value="#333333" maxlength="7" placeholder="#333333">
                        </div>
                        <div class="control-group">
                            <label for="sugarBorderOpacity">边缘透明度:</label>
                            <input type="range" id="sugarBorderOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="sugarBorderOpacityValue">100%</span>
                        </div>
                    </div>
                    
                    <!-- Connection Line Style -->
                    <div class="control-subsection">
                        <h4>连接线样式</h4>
                        <div class="connection-status" id="connectionStatus">
                            <span class="status-text">选中了 0 条连接线</span>
                        </div>
                        <div class="control-group">
                            <label for="connectionWidth">粗细:</label>
                            <input type="range" id="connectionWidth" min="1" max="8" value="2" step="0.5">
                            <span id="connectionWidthValue">2</span>
                        </div>
                        <div class="control-group">
                            <label>样式:</label>
                            <div class="connection-style-buttons">
                                <button class="connection-style-btn active" data-style="solid">实线</button>
                                <button class="connection-style-btn" data-style="dashed">虚线</button>
                                <button class="connection-style-btn" data-style="dotted">点线</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="connectionColor">颜色:</label>
                            <input type="color" id="connectionColor" value="#333333">
                            <input type="text" id="connectionColorHex" value="#333333" maxlength="7" placeholder="#333333">
                        </div>
                        <div class="control-group">
                            <label for="connectionOpacity">透明度:</label>
                            <input type="range" id="connectionOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="connectionOpacityValue">100%</span>
                        </div>
                    </div>
                </div>
                
                <!-- Text Controls (visible when text tool or text selected) -->
                <div class="panel-section" id="textControlsSection" style="display: none;">
                    <div class="control-subsection">
                        <h4>文字样式</h4>
                        <div class="control-group">
                            <label for="fontSize">字号:</label>
                            <input type="range" id="fontSize" min="8" max="48" value="16" step="1">
                            <span id="fontSizeValue">16</span>
                        </div>
                        <div class="control-group">
                            <label for="fontFamily">字体:</label>
                            <select id="fontFamily">
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Helvetica">Helvetica</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Verdana">Verdana</option>
                                <option value="SimSun">宋体</option>
                                <option value="SimHei">黑体</option>
                                <option value="KaiTi">楷体</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>样式:</label>
                            <div class="text-style-buttons">
                                <button class="text-style-btn" id="boldBtn" data-style="bold" title="粗体">
                                    <strong>B</strong>
                                </button>
                                <button class="text-style-btn" id="italicBtn" data-style="italic" title="斜体">
                                    <em>I</em>
                                </button>
                                <button class="text-style-btn" id="underlineBtn" data-style="underline" title="下划线">
                                    <u>U</u>
                                </button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="textColor">颜色:</label>
                            <input type="color" id="textColor" value="#000000">
                            <input type="text" id="textColorHex" value="#000000" maxlength="7" placeholder="#000000">
                        </div>
                        <div class="control-group">
                            <label for="textOpacity">透明度:</label>
                            <input type="range" id="textOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="textOpacityValue">100%</span>
                        </div>
                    </div>
                </div>
                
                <!-- Empty State (when no relevant selections) -->
                <div class="panel-section" id="emptyControlsSection" style="display: none;">
                    <div class="empty-state">
                        <p>选择工具或元素以显示调整选项</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
