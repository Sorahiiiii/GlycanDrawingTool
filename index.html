<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glycan Drawing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Cover -->
    <div id="loadingCover" class="loading-cover">
        <div class="loading-content">
            <img src="Dolly.gif" alt="Loading..." class="loading-gif" />
            <div class="loading-text">准备中...</div>
            <div class="loading-progress">
                <div class="progress-line progress-line-left"></div>
                <div class="progress-line progress-line-right"></div>
            </div>
        </div>
    </div>
    
    <div class="app-container">
        <h1>Glycan Drawing Tool</h1>
        
        <!-- Top Panel: Actions and Functions -->
        <div class="top-panel">
            <div class="action-buttons">
                <button id="undoBtn" class="action-btn undo">撤回</button>
                <button id="redoBtn" class="action-btn redo">恢复</button>
                
                <!-- Export dropdown -->
                <div class="export-dropdown">
                    <button id="exportBtn" class="action-btn export">导出 ▾</button>
                    <div class="export-options">
                        <div class="export-option" data-format="svg">SVG（可编辑矢量）</div>
                        <div class="export-option" data-format="png">PNG（透明背景）</div>
                        <div class="export-option" data-format="jpg">JPG（白色背景）</div>
                    </div>
                </div>
                
                <button id="clearBtn" class="action-btn clear">清空画布</button>
                
                <!-- Canvas Size Controls -->
                <div class="canvas-size-controls">
                    <label>导出区域:</label>
                    <button id="canvasSmall" class="size-btn" data-size="small">小</button>
                    <button id="canvasMedium" class="size-btn active" data-size="medium">中</button>
                    <button id="canvasLarge" class="size-btn" data-size="large">大</button>
                </div>
                
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <label>缩放:</label>
                    <input type="range" id="zoomSlider" min="50" max="300" value="100" step="10">
                    <span id="zoomValue">100%</span>
                    <button id="zoomReset" class="action-btn">重置</button>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Left Panel: Tools -->
            <div class="left-panel">
                <div class="panel-section">
                    <h3>工具</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="select" title="选择">
                            <span>↖️</span>
                            选择
                        </button>
                        <button class="tool-btn" data-tool="add" title="添加糖">
                            <span>🍬</span>
                            添加糖
                        </button>
                        <button class="tool-btn" data-tool="text" title="添加文字">
                            <span>📝</span>
                            添加文字
                        </button>
                        <button class="tool-btn" data-tool="delete" title="橡皮擦">
                            <span>🧽</span>
                            橡皮擦
                        </button>
                    </div>
                </div>
                <div class="feedback-text">反馈bug:<br>x-yguo@pku.edu.cn</div>
                <div class="ayfl-logo">
                    <img src="ayfl.jpg" alt="AYFL" />
                </div>
            </div>
            
            <!-- Center: Workspace -->
            <div class="center-panel">
                <div id="workspace" class="workspace">
                    <!-- Export area visual background (not a container) -->
                    <div id="exportArea" class="export-area"></div>
                    <!-- SVG canvas spans entire workspace -->
                    <svg id="canvas" class="workspace-canvas" viewBox="0 0 4000 2800">
                        <!-- SVG content will be added here -->
                    </svg>
                </div>
            </div>
            
            <!-- Right Panel: Sugar Presets and Customization -->
            <!-- Right Panel - Adjustments -->
            <div class="right-panel">
                <!-- Sugar Controls (visible when add tool or sugars selected) -->
                <div class="panel-section" id="sugarControlsSection" style="display: none;">
                    <!-- SFNG Presets -->
                    <div class="control-subsection">
                        <h4>SNFG 糖预设</h4>
                        <div class="preset-grid-snfg" id="presetGrid">
                            <!-- Row 1 - Circles -->
                            <div class="preset-item" data-preset="glc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#0072BC" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Glc</span>
                            </div>
                            <div class="preset-item" data-preset="gal">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#FFD400" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Gal</span>
                            </div>
                            <div class="preset-item" data-preset="man">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#00A651" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Man</span>
                            </div>
                            <!-- Row 2 - Squares -->
                            <div class="preset-item" data-preset="glcnac">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="#0072BC" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>GlcNAc</span>
                            </div>
                            <div class="preset-item" data-preset="galnac">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="#FFD400" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>GalNAc</span>
                            </div>
                            <div class="preset-item" data-preset="fuc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,4 26.39,22 5.61,22" fill="#ED1C24" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Fuc</span>
                            </div>
                            <!-- Row 3 - Special shapes -->
                            <div class="preset-item" data-preset="glca">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <defs>
                                        <linearGradient id="glca-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="50%" stop-color="#0072BC"/>
                                            <stop offset="50%" stop-color="white"/>
                                        </linearGradient>
                                    </defs>
                                    <polygon points="16,4 28,16 16,28 4,16" fill="url(#glca-gradient)" stroke="#000000" stroke-width="2"/>
                                    <line x1="4" y1="16" x2="28" y2="16" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>GlcA</span>
                            </div>
                            <div class="preset-item" data-preset="sia">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,4 28,16 16,28 4,16" fill="#A54399" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Sia</span>
                            </div>
                            <div class="preset-item" data-preset="xyl">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,4 19.42,12.94 28,12.94 21.29,17.82 23.71,26.76 16,21.88 8.29,26.76 10.71,17.82 4,12.94 12.58,12.94" fill="#F47920" stroke="#000000" stroke-width="2"/>
                                </svg>
                                <span>Xyl</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Sugar Type -->
                    <div class="control-subsection">
                        <h4>自定义糖型</h4>
                        
                        <!-- Shape Selection -->
                        <div class="control-group">
                            <label>形状:</label>
                            <div class="shape-selector-grid" id="shapeSelectorGrid">
                                <!-- Row 1 -->
                                <div class="shape-category" data-category="circle">
                                    <button class="shape-main-btn active" data-shape="circle-filled" title="圆形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <circle cx="9" cy="9" r="6.75" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="circle">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="circle">
                                        <div class="shape-dropdown-item active" data-shape="circle-filled" title="正圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <circle cx="8" cy="8" r="6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="circle-flat" title="扁椭圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <ellipse cx="8" cy="8" rx="6.5" ry="3.5" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="circle-narrow" title="窄椭圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <ellipse cx="8" cy="8" rx="3.5" ry="6.5" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="square">
                                    <button class="shape-main-btn" data-shape="square" title="方形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <rect x="2.7" y="2.7" width="12.6" height="12.6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="square">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="square">
                                        <div class="shape-dropdown-item active" data-shape="square" title="正方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="2.4" width="11.2" height="11.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-flat" title="扁正方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="5.04" width="11.2" height="5.92" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-narrow" title="窄正方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="5.04" y="2.4" width="5.92" height="11.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-divided" title="分割正方形（左下白）">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <defs>
                                                    <linearGradient id="square-divided-icon" x1="0%" y1="100%" x2="100%" y2="0%">
                                                        <stop offset="50%" stop-color="white"/>
                                                        <stop offset="50%" stop-color="#888888"/>
                                                    </linearGradient>
                                                </defs>
                                                <polygon points="2.4,2.4 13.6,2.4 13.6,13.6 2.4,13.6" fill="url(#square-divided-icon)" stroke="#000000" stroke-width="1"/>
                                                <line x1="2.4" y1="2.4" x2="13.6" y2="13.6" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="diamond">
                                    <button class="shape-main-btn" data-shape="diamond" title="菱形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9,2.7 15.3,9 9,15.3 2.7,9" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="diamond">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="diamond">
                                        <div class="shape-dropdown-item active" data-shape="diamond" title="常规菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-flat" title="扁菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,4.4 12.6,8 8,11.6 3.4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-narrow" title="窄菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,1.4 11.6,8 8,14.6 4.4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-divided-top" title="分割菱形（下白）">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <defs>
                                                    <linearGradient id="diamond-divided-top-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                                                        <stop offset="50%" stop-color="#888888" stop-opacity="1"/>
                                                        <stop offset="50%" stop-color="white" stop-opacity="1"/>
                                                    </linearGradient>
                                                </defs>
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="url(#diamond-divided-top-icon)" stroke="#000000" stroke-width="1"/>
                                                <line x1="2.4" y1="8" x2="13.6" y2="8" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-divided-bottom" title="分割菱形（上白）">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <defs>
                                                    <linearGradient id="diamond-divided-bottom-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                                                        <stop offset="50%" stop-color="white" stop-opacity="1"/>
                                                        <stop offset="50%" stop-color="#888888" stop-opacity="1"/>
                                                    </linearGradient>
                                                </defs>
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="url(#diamond-divided-bottom-icon)" stroke="#000000" stroke-width="1"/>
                                                <line x1="2.4" y1="8" x2="13.6" y2="8" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Row 2 -->
                                <div class="shape-category" data-category="triangle">
                                    <button class="shape-main-btn" data-shape="triangle" title="正三角形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.8 14.4,12.1 3.6,12.1" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="triangle">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="triangle">
                                        <div class="shape-dropdown-item active" data-shape="triangle" title="正三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 12.8,10.8 3.2,10.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="triangle-inverted" title="倒立三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,13.5 3.2,5.3 12.8,5.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="triangle-divided" title="分割三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <defs>
                                                    <linearGradient id="preview-divided-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                                        <stop offset="50%" stop-color="white" stop-opacity="1"/>
                                                        <stop offset="50%" stop-color="#888888" stop-opacity="1"/>
                                                    </linearGradient>
                                                </defs>
                                                <polygon points="8.0,2.5 12.8,10.8 3.2,10.8" fill="url(#preview-divided-gradient)" stroke="#000000" stroke-width="1"/>
                                                <!-- 分割线 -->
                                                <line x1="8.0" y1="2.5" x2="8.0" y2="10.8" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="star">
                                    <button class="shape-main-btn" data-shape="star-5" title="星形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.8 10.5,7.0 14.9,7.1 11.4,9.8 12.6,14.0 9.0,11.5 5.4,14.0 6.6,9.8 3.1,7.1 7.5,7.0" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="star">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="star">
                                        <div class="shape-dropdown-item active" data-shape="star-5" title="正五角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.3,6.2 13.2,6.3 10.1,8.7 11.2,12.4 8.0,10.2 4.8,12.4 5.9,8.7 2.8,6.3 6.7,6.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-5-inverted" title="倒立五角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,13.5 6.7,9.8 2.8,9.7 5.9,7.3 4.8,3.6 8.0,5.8 11.2,3.6 10.1,7.3 13.2,9.7 9.3,9.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-4" title="正四角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.6,6.4 13.5,8.0 9.6,9.6 8.0,13.5 6.4,9.6 2.5,8.0 6.4,6.4" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-4-tilted" title="斜四角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="11.9,4.1 10.2,8.0 11.9,11.9 8.0,10.2 4.1,11.9 5.8,8.0 4.1,4.1 8.0,5.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-6" title="正六角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.1,6.1 12.8,5.2 10.2,8.0 12.8,10.8 9.1,9.9 8.0,13.5 6.9,9.9 3.2,10.8 5.8,8.0 3.2,5.3 6.9,6.1" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-6-tilted" title="斜六角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="10.8,3.2 9.9,6.9 13.5,8.0 9.9,9.1 10.8,12.8 8.0,10.2 5.3,12.8 6.1,9.1 2.5,8.0 6.1,6.9 5.2,3.2 8.0,5.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="pentagon">
                                    <button class="shape-main-btn" data-shape="pentagon" title="正五边形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.7 15.0,7.1 12.7,14.1 5.3,14.1 3.0,7.1" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="pentagon">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="pentagon">
                                        <div class="shape-dropdown-item active" data-shape="pentagon" title="正五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 13.3,6.3 11.3,12.5 4.7,12.5 2.7,6.3" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="pentagon-inverted" title="倒立五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,13.6 2.7,9.7 4.7,3.5 11.3,3.5 13.3,9.7" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Row 3 -->
                                <div class="shape-category" data-category="hexagon">
                                    <button class="shape-main-btn" data-shape="hexagon" title="正六边形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="15.3,9.0 12.2,14.4 5.8,14.4 2.7,9.0 5.8,3.6 12.2,3.6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="hexagon">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="hexagon">
                                        <div class="shape-dropdown-item active" data-shape="hexagon" title="正六边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="13.5,8.0 10.8,12.8 5.3,12.8 2.5,8.0 5.2,3.2 10.8,3.2" fill="#888888" stroke="#000000" stroke-width="1"/>

                                <button class="color-btn-compact active" data-target="connectionColor" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#ffffff" style="background-color: #ffffff;" title="白色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#808080" style="background-color: #808080;" title="灰色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#ff0000" style="background-color: #ff0000;" title="红色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#ffff00" style="background-color: #ffff00;" title="黄色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#008000" style="background-color: #008000;" title="绿色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#0000ff" style="background-color: #0000ff;" title="蓝色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#800080" style="background-color: #800080;" title="紫色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="connectionColor" value="#000000">
                                <input type="text" id="connectionColorHex" value="#000000" maxlength="7" placeholder="#000000">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="linkageTextSize">标注字号:</label>
                            <input type="range" id="linkageTextSize" min="8" max="24" value="12" step="1">
                            <span id="linkageTextSizeValue">12</span>
                        </div>
                        <div class="control-group">
                            <label for="linkageTextFontFamily">标注字体:</label>
                            <select id="linkageTextFontFamily">
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Helvetica">Helvetica</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Verdana">Verdana</option>
                                <option value="SimSun">宋体</option>
                                <option value="SimHei">黑体</option>
                                <option value="KaiTi">楷体</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>标注样式:</label>
                            <div class="linkage-text-style-buttons">
                                <button class="linkage-text-style-btn" id="linkageTextBoldBtn" data-style="bold" title="粗体">
                                    <strong>B</strong>
                                </button>
                                <button class="linkage-text-style-btn" id="linkageTextItalicBtn" data-style="italic" title="斜体">
                                    <em>I</em>
                                </button>
                                <button class="linkage-text-style-btn" id="linkageTextUnderlineBtn" data-style="underline" title="下划线">
                                    <u>U</u>
                                </button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>标注颜色:</label>
                            <div class="color-grid-compact">
                                <button class="color-btn-compact active" data-target="linkageTextColor" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#ffffff" style="background-color: #ffffff;" title="白色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#808080" style="background-color: #808080;" title="灰色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#ff0000" style="background-color: #ff0000;" title="红色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#ffff00" style="background-color: #ffff00;" title="黄色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#008000" style="background-color: #008000;" title="绿色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#0000ff" style="background-color: #0000ff;" title="蓝色"></button>
                                <button class="color-btn-compact" data-target="linkageTextColor" data-color="#800080" style="background-color: #800080;" title="紫色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="linkageTextColor" value="#000000">
                                <input type="text" id="linkageTextColorHex" value="#000000" maxlength="7" placeholder="#000000">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="linkageTextOpacity">标注透明度:</label>
                            <input type="range" id="linkageTextOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="linkageTextOpacityValue">100%</span>
                        </div>
                    </div>
                </div>
                
                <!-- Empty State (when no relevant selections) -->
                <div class="panel-section" id="emptyControlsSection" style="display: block;">
                    <div class="empty-state">
                        <p>选择工具或元素以显示调整选项</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
