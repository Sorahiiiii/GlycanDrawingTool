<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glycan Drawing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Glycan Drawing Tool</h1>
        
        <!-- Top Panel: Actions and Functions -->
        <div class="top-panel">
            <div class="action-buttons">
                <button id="undoBtn" class="action-btn undo">撤回</button>
                <button id="redoBtn" class="action-btn redo">恢复</button>
                
                <!-- Export dropdown -->
                <div class="export-dropdown">
                    <button id="exportBtn" class="action-btn export">导出 ▾</button>
                    <div class="export-options">
                        <div class="export-option" data-format="svg">SVG（可编辑矢量）</div>
                        <div class="export-option" data-format="png">PNG（透明背景）</div>
                        <div class="export-option" data-format="jpg">JPG（白色背景）</div>
                    </div>
                </div>
                
                <button id="clearBtn" class="action-btn clear">清空画布</button>
                
                <!-- Canvas Size Controls -->
                <div class="canvas-size-controls">
                    <label>导出区域:</label>
                    <button id="canvasSmall" class="size-btn" data-size="small">小</button>
                    <button id="canvasMedium" class="size-btn active" data-size="medium">中</button>
                    <button id="canvasLarge" class="size-btn" data-size="large">大</button>
                </div>
                
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <label>缩放:</label>
                    <input type="range" id="zoomSlider" min="50" max="300" value="100" step="10">
                    <span id="zoomValue">100%</span>
                    <button id="zoomReset" class="action-btn">重置</button>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Left Panel: Tools -->
            <div class="left-panel">
                <div class="panel-section">
                    <h3>工具</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="select" title="选择">
                            <span>↖️</span>
                            选择
                        </button>
                        <button class="tool-btn" data-tool="add" title="添加糖">
                            <span>🍬</span>
                            添加糖
                        </button>
                        <button class="tool-btn" data-tool="text" title="添加文字">
                            <span>📝</span>
                            添加文字
                        </button>
                        <button class="tool-btn" data-tool="delete" title="橡皮擦">
                            <span>🧽</span>
                            橡皮擦
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Center: Workspace -->
            <div class="center-panel">
                <div id="workspace" class="workspace">
                    <!-- Export area visual background (not a container) -->
                    <div id="exportArea" class="export-area"></div>
                    <!-- SVG canvas spans entire workspace -->
                    <svg id="canvas" class="workspace-canvas" viewBox="0 0 4000 2800">
                        <!-- SVG content will be added here -->
                    </svg>
                </div>
            </div>
            
            <!-- Right Panel: Sugar Presets and Customization -->
            <!-- Right Panel - Adjustments -->
            <div class="right-panel">
                <!-- Sugar Controls (visible when add tool or sugars selected) -->
                <div class="panel-section" id="sugarControlsSection" style="display: none;">
                    <!-- SFNG Presets -->
                    <div class="control-subsection">
                        <h4>SNFG 糖预设</h4>
                        <div class="preset-grid-snfg" id="presetGrid">
                            <!-- Row 1 -->
                            <div class="preset-item" data-preset="glc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
                                </svg>
                                <span>Glc</span>
                            </div>
                            <div class="preset-item" data-preset="gal">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                                </svg>
                                <span>Gal</span>
                            </div>
                            <div class="preset-item" data-preset="man">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <circle cx="16" cy="16" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
                                </svg>
                                <span>Man</span>
                            </div>
                            <!-- Row 2 -->
                            <div class="preset-item" data-preset="fuc">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,4 28,16 16,28 4,16" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
                                </svg>
                                <span>Fuc</span>
                            </div>
                            <div class="preset-item" data-preset="xyl">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <polygon points="16,6 26,24 6,24" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
                                </svg>
                                <span>Xyl</span>
                            </div>
                            <div class="preset-item" data-preset="glcnac">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
                                </svg>
                                <span>GlcNAc</span>
                            </div>
                            <!-- Row 3 - Reserved positions -->
                            <div class="preset-item disabled" data-preset="">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
                                </svg>
                                <span>预留</span>
                            </div>
                            <div class="preset-item disabled" data-preset="">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
                                </svg>
                                <span>预留</span>
                            </div>
                            <div class="preset-item disabled" data-preset="">
                                <svg width="32" height="32" viewBox="0 0 32 32">
                                    <rect x="4" y="4" width="24" height="24" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
                                </svg>
                                <span>预留</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Sugar Type -->
                    <div class="control-subsection">
                        <h4>自定义糖型</h4>
                        
                        <!-- Shape Selection -->
                        <div class="control-group">
                            <label>形状:</label>
                            <div class="shape-selector-grid" id="shapeSelectorGrid">
                                <!-- Row 1 -->
                                <div class="shape-category" data-category="circle">
                                    <button class="shape-main-btn active" data-shape="circle-filled" title="圆形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <circle cx="9" cy="9" r="6.75" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="circle">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="circle">
                                        <div class="shape-dropdown-item active" data-shape="circle-filled" title="正圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <circle cx="8" cy="8" r="6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="circle-flat" title="扁椭圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <ellipse cx="8" cy="8" rx="8.4" ry="4.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="circle-narrow" title="窄椭圆形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <ellipse cx="8" cy="8" rx="4.2" ry="8.4" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="square">
                                    <button class="shape-main-btn" data-shape="square" title="方形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <rect x="2.7" y="2.7" width="12.6" height="12.6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="square">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="square">
                                        <div class="shape-dropdown-item active" data-shape="square" title="方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="2.4" width="11.2" height="11.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-filled" title="实心方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="2.4" width="11.2" height="11.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-rounded" title="圆角方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="2.4" width="11.2" height="11.2" rx="1.8" ry="1.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="square-double" title="双线方形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="2.4" y="2.4" width="11.2" height="11.2" fill="none" stroke="#888888" stroke-width="2"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="diamond">
                                    <button class="shape-main-btn" data-shape="diamond" title="菱形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9,2.7 15.3,9 9,15.3 2.7,9" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="diamond">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="diamond">
                                        <div class="shape-dropdown-item active" data-shape="diamond" title="菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-filled" title="实心菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-outline" title="空心菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 13.6,8 8,13.6 2.4,8" fill="none" stroke="#888888" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="diamond-small" title="小菱形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,4 12,8 8,12 4,8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Row 2 -->
                                <div class="shape-category" data-category="triangle">
                                    <button class="shape-main-btn" data-shape="triangle" title="三角形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9,2.7 14.4558,12.15 3.5442,12.15" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="triangle">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="triangle">
                                        <div class="shape-dropdown-item active" data-shape="triangle" title="三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 12.849,10.8 3.151,10.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="triangle-filled" title="实心三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 12.849,10.8 3.151,10.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="triangle-outline" title="空心三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8,2.4 12.849,10.8 3.151,10.8" fill="none" stroke="#888888" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="triangle-down" title="倒三角形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="3.151,5.2 12.849,5.2 8,13.6" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="star">
                                    <button class="shape-main-btn" data-shape="star-5" title="星形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.8 10.5,7.0 14.9,7.1 11.4,9.8 12.6,14.0 9.0,11.5 5.4,14.0 6.6,9.8 3.1,7.1 7.5,7.0" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="star">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="star">
                                        <div class="shape-dropdown-item active" data-shape="star-5" title="正五角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.3,6.2 13.2,6.3 10.1,8.7 11.2,12.4 8.0,10.2 4.8,12.4 5.9,8.7 2.8,6.3 6.7,6.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-5-inverted" title="倒立五角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,13.5 6.7,9.8 2.8,9.7 5.9,7.3 4.8,3.6 8.0,5.8 11.2,3.6 10.1,7.3 13.2,9.7 9.3,9.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-4" title="正四角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.6,6.4 13.5,8.0 9.6,9.6 8.0,13.5 6.4,9.6 2.5,8.0 6.4,6.4" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-4-tilted" title="斜四角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="11.9,4.1 10.2,8.0 11.9,11.9 8.0,10.2 4.1,11.9 5.8,8.0 4.1,4.1 8.0,5.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-6" title="正六角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.5 9.1,6.1 12.8,5.2 10.2,8.0 12.8,10.8 9.1,9.9 8.0,13.5 6.9,9.9 3.2,10.8 5.8,8.0 3.2,5.3 6.9,6.1" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="star-6-tilted" title="斜六角星">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="10.8,3.2 9.9,6.9 13.5,8.0 9.9,9.1 10.8,12.8 8.0,10.2 5.3,12.8 6.1,9.1 2.5,8.0 6.1,6.9 5.2,3.2 8.0,5.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="pentagon">
                                    <button class="shape-main-btn" data-shape="pentagon" title="正五边形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.7 15.0,7.1 12.7,14.1 5.3,14.1 3.0,7.1" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="pentagon">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="pentagon">
                                        <div class="shape-dropdown-item active" data-shape="pentagon" title="正五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 13.3,6.3 11.3,12.5 4.7,12.5 2.7,6.3" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="pentagon-filled" title="实心五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 13.3,6.3 11.3,12.5 4.7,12.5 2.7,6.3" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="pentagon-outline" title="空心五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 13.3,6.3 11.3,12.5 4.7,12.5 2.7,6.3" fill="none" stroke="#888888" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="pentagon-double" title="双线五边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 13.3,6.3 11.3,12.5 4.7,12.5 2.7,6.3" fill="none" stroke="#888888" stroke-width="2"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Row 3 -->
                                <div class="shape-category" data-category="hexagon">
                                    <button class="shape-main-btn" data-shape="hexagon" title="正六边形">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <polygon points="9.0,2.7 14.5,5.8 14.5,12.1 9.0,15.3 3.5,12.2 3.5,5.8" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="hexagon">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="hexagon">
                                        <div class="shape-dropdown-item active" data-shape="hexagon" title="正六边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 12.8,5.2 12.8,10.8 8.0,13.6 3.2,10.8 3.2,5.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="hexagon-filled" title="实心六边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 12.8,5.2 12.8,10.8 8.0,13.6 3.2,10.8 3.2,5.2" fill="#888888" stroke="#000000" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="hexagon-outline" title="空心六边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 12.8,5.2 12.8,10.8 8.0,13.6 3.2,10.8 3.2,5.2" fill="none" stroke="#888888" stroke-width="1"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="hexagon-bold" title="粗边六边形">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <polygon points="8.0,2.4 12.8,5.2 12.8,10.8 8.0,13.6 3.2,10.8 3.2,5.2" fill="none" stroke="#888888" stroke-width="2"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="check">
                                    <button class="shape-main-btn" data-shape="check" title="对勾形状">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <path d="M3 9l4 4 8-8" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="check">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="check">
                                        <div class="shape-dropdown-item active" data-shape="check" title="对勾">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M2.5 8l3.5 3.5 7-7" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="check-bold" title="粗对勾">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M2.5 8l3.5 3.5 7-7" fill="none" stroke="#888888" stroke-width="2.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="check-box" title="方框对勾">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <rect x="1.5" y="1.5" width="13" height="13" fill="none" stroke="#888888" stroke-width="1"/>
                                                <path d="M4 8l2.5 2.5 5-5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="check-circle" title="圆圈对勾">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <circle cx="8" cy="8" r="6.5" fill="none" stroke="#888888" stroke-width="1"/>
                                                <path d="M4 8l2.5 2.5 5-5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="shape-category" data-category="wave">
                                    <button class="shape-main-btn" data-shape="wave" title="波浪线">
                                        <span class="shape-icon">
                                            <svg width="18" height="18" viewBox="0 0 18 18">
                                                <path d="M2 9 Q5 6 8 9 T14 9" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="shape-dropdown-btn" data-category="wave">
                                        <span class="dropdown-arrow">▼</span>
                                    </button>
                                    <div class="shape-dropdown-menu" data-category="wave">
                                        <div class="shape-dropdown-item active" data-shape="wave" title="波浪线">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M1.5 8 Q4 5.5 7 8 T12.5 8" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="wave-double" title="双波浪线">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M1.5 6 Q4 3.5 7 6 T12.5 6" fill="none" stroke="#888888" stroke-width="1.2" stroke-linecap="round"/>
                                                <path d="M1.5 10 Q4 7.5 7 10 T12.5 10" fill="none" stroke="#888888" stroke-width="1.2" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="wave-sine" title="正弦波">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M1 8 Q4 3.5 8 8 Q12 12.5 15 8" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                        <div class="shape-dropdown-item" data-shape="wave-zigzag" title="锯齿波">
                                            <svg width="16" height="16" viewBox="0 0 16 16">
                                                <path d="M1.5 11 L5 5 L8.5 11 L12 5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Color Selection -->
                        <div class="control-group">
                            <label>颜色:</label>
                            <div class="color-grid" id="colorGrid">
                                <button class="color-btn active" data-color="#3498db" style="background-color: #3498db;" title="蓝色"></button>
                                <button class="color-btn" data-color="#e74c3c" style="background-color: #e74c3c;" title="红色"></button>
                                <button class="color-btn" data-color="#2ecc71" style="background-color: #2ecc71;" title="绿色"></button>
                                <button class="color-btn" data-color="#f39c12" style="background-color: #f39c12;" title="橙色"></button>
                                <button class="color-btn" data-color="#9b59b6" style="background-color: #9b59b6;" title="紫色"></button>
                                <button class="color-btn" data-color="#34495e" style="background-color: #34495e;" title="灰色"></button>
                                <button class="color-btn" data-color="#1abc9c" style="background-color: #1abc9c;" title="青色"></button>
                                <button class="color-btn" data-color="#f1c40f" style="background-color: #f1c40f;" title="黄色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="customSugarColor" value="#3498db">
                                <input type="text" id="customSugarColorHex" value="#3498db" maxlength="7" placeholder="#3498db">
                            </div>
                            <div class="control-group">
                                <label for="customSugarOpacity">糖填充透明度:</label>
                                <input type="range" id="customSugarOpacity" min="0" max="1" value="1" step="0.1">
                                <span id="customSugarOpacityValue">100%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Sugar Style -->
                    <div class="control-subsection">
                        <h4>糖样式</h4>
                        <div class="control-group">
                            <label for="sugarSize">大小:</label>
                            <input type="range" id="sugarSize" min="10" max="40" value="20" step="2">
                            <span id="sugarSizeValue">20</span>
                        </div>
                        <div class="control-group">
                            <label for="sugarBorderWidth">边缘粗细:</label>
                            <input type="range" id="sugarBorderWidth" min="1" max="5" value="2" step="0.5">
                            <span id="sugarBorderWidthValue">2</span>
                        </div>
                        <div class="control-group">
                            <label>边缘样式:</label>
                            <div class="border-style-buttons">
                                <button class="border-style-btn active" data-style="solid">实线</button>
                                <button class="border-style-btn" data-style="dashed">虚线</button>
                                <button class="border-style-btn" data-style="dotted">点线</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>边缘颜色:</label>
                            <div class="color-grid-compact">
                                <button class="color-btn-compact active" data-target="sugarBorderColor" data-color="#333333" style="background-color: #333333;" title="深灰色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#666666" style="background-color: #666666;" title="灰色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#999999" style="background-color: #999999;" title="浅灰色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#e74c3c" style="background-color: #e74c3c;" title="红色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#3498db" style="background-color: #3498db;" title="蓝色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#2ecc71" style="background-color: #2ecc71;" title="绿色"></button>
                                <button class="color-btn-compact" data-target="sugarBorderColor" data-color="#f39c12" style="background-color: #f39c12;" title="橙色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="sugarBorderColor" value="#333333">
                                <input type="text" id="sugarBorderColorHex" value="#333333" maxlength="7" placeholder="#333333">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="sugarBorderOpacity">边缘透明度:</label>
                            <input type="range" id="sugarBorderOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="sugarBorderOpacityValue">100%</span>
                        </div>
                    </div>
                    
                    <!-- Connection Line Style -->
                    <div class="control-subsection">
                        <h4>连接线样式</h4>
                        <div class="connection-status" id="connectionStatus">
                            <span class="status-text">选中了 0 条连接线</span>
                        </div>
                        <div class="control-group">
                            <label for="connectionWidth">粗细:</label>
                            <input type="range" id="connectionWidth" min="1" max="8" value="2" step="0.5">
                            <span id="connectionWidthValue">2</span>
                        </div>
                        <div class="control-group">
                            <label>样式:</label>
                            <div class="connection-style-buttons">
                                <button class="connection-style-btn active" data-style="solid">实线</button>
                                <button class="connection-style-btn" data-style="dashed">虚线</button>
                                <button class="connection-style-btn" data-style="dotted">点线</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>颜色:</label>
                            <div class="color-grid-compact">
                                <button class="color-btn-compact active" data-target="connectionColor" data-color="#333333" style="background-color: #333333;" title="深灰色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#666666" style="background-color: #666666;" title="灰色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#999999" style="background-color: #999999;" title="浅灰色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#e74c3c" style="background-color: #e74c3c;" title="红色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#3498db" style="background-color: #3498db;" title="蓝色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#2ecc71" style="background-color: #2ecc71;" title="绿色"></button>
                                <button class="color-btn-compact" data-target="connectionColor" data-color="#f39c12" style="background-color: #f39c12;" title="橙色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="connectionColor" value="#333333">
                                <input type="text" id="connectionColorHex" value="#333333" maxlength="7" placeholder="#333333">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="connectionOpacity">透明度:</label>
                            <input type="range" id="connectionOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="connectionOpacityValue">100%</span>
                        </div>
                    </div>
                </div>
                
                <!-- Text Controls (visible when text tool or text selected) -->
                <div class="panel-section" id="textControlsSection" style="display: none;">
                    <div class="control-subsection">
                        <h4>文字样式</h4>
                        <div class="control-group">
                            <label for="fontSize">字号:</label>
                            <input type="range" id="fontSize" min="8" max="48" value="16" step="1">
                            <span id="fontSizeValue">16</span>
                        </div>
                        <div class="control-group">
                            <label for="fontFamily">字体:</label>
                            <select id="fontFamily">
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Helvetica">Helvetica</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Verdana">Verdana</option>
                                <option value="SimSun">宋体</option>
                                <option value="SimHei">黑体</option>
                                <option value="KaiTi">楷体</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>样式:</label>
                            <div class="text-style-buttons">
                                <button class="text-style-btn" id="boldBtn" data-style="bold" title="粗体">
                                    <strong>B</strong>
                                </button>
                                <button class="text-style-btn" id="italicBtn" data-style="italic" title="斜体">
                                    <em>I</em>
                                </button>
                                <button class="text-style-btn" id="underlineBtn" data-style="underline" title="下划线">
                                    <u>U</u>
                                </button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>颜色:</label>
                            <div class="color-grid-compact">
                                <button class="color-btn-compact active" data-target="textColor" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#333333" style="background-color: #333333;" title="深灰色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#666666" style="background-color: #666666;" title="灰色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#999999" style="background-color: #999999;" title="浅灰色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#e74c3c" style="background-color: #e74c3c;" title="红色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#3498db" style="background-color: #3498db;" title="蓝色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#2ecc71" style="background-color: #2ecc71;" title="绿色"></button>
                                <button class="color-btn-compact" data-target="textColor" data-color="#f39c12" style="background-color: #f39c12;" title="橙色"></button>
                            </div>
                            <div class="custom-color-section">
                                <input type="color" id="textColor" value="#000000">
                                <input type="text" id="textColorHex" value="#000000" maxlength="7" placeholder="#000000">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="textOpacity">透明度:</label>
                            <input type="range" id="textOpacity" min="0" max="1" value="1" step="0.1">
                            <span id="textOpacityValue">100%</span>
                        </div>
                    </div>
                </div>
                
                <!-- Empty State (when no relevant selections) -->
                <div class="panel-section" id="emptyControlsSection" style="display: block;">
                    <div class="empty-state">
                        <p>选择工具或元素以显示调整选项</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
